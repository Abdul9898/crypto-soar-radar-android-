name: Build Crypto Soar Radar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias cryptosoar \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosoar \
              -keypass cryptosoar \
              -dname "CN=CryptoSoar,OU=Trading,O=SoarAI,C=US"
          fi

      - name: Build Release APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSoarRadar.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSoarRadar-APK
          path: output/CryptoSoarRadar.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.31
          name: Crypto Soar Radar v1.1.31
          body: |
            ### ⚡ Crypto Soar Radar v1.1.31 (Unrestricted Full Rebuild)
            - **5-Tab Multi-Screen Experience:** Market Dashboard, Explore Screener, Gainify Strategy Simulator, Portfolio Tracker, and More Settings.
            - **100% Unlocked Surge & Uptrend Potential:** Instant access to short-term surge probability and multi-day uptrend cards without paywalls.
            - **Explore Technical Screener:** Scan by 5MA x 20MA Golden/Death Cross, RSI Oversold (<30), 3+ Day Continuous Rise Streaks, and Recent Surges.
            - **Gainify Backtester:** Simulate custom buy and sell conditions over 60 days of historical exchange data.
            - **Exchange Switcher:** Real-time multi-exchange switching between Binance, Coinbase, Upbit, and Bithumb.
            - **Interactive Coin Details & Profit Calculator:** Tap any coin to view live price charts, quant ratings, target prices, and dynamic profit calculator.
            - **Surge-Plunge Alert Watcher:** Fully customizable momentum alerts.
          files: output/CryptoSoarRadar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
